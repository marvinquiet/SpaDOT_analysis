<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Collapsible Tree Example</title>

    <style>

 .node circle {
   fill: #000000;
   stroke: #000000;
   stroke-width: 5px;
 }

 .node text { font: 12px sans-serif; }

 .link {
   fill: none;
   stroke: #000000;
   stroke-width: 2.5px;
 }
 
    </style>

  </head>

  <body>

<!-- load the d3.js library --> 
<script src="http://d3js.org/d3.v3.min.js"></script>
 
<script>

var treeData = [
{"name": "node", "children": [{"name": "t0:CNS", "children": [{"name": "t1:Men/PNS", "edge_weight": 0.376715171019658, "fx": "11", "node_group": "#4EAEF0"}, {"name": "t1:CNS", "children": [{"name": "t2:CNS", "edge_weight": 0.877922025441001, "fx": "3", "node_group": "#F8766D"}, {"name": "t2:Men/PNS", "edge_weight": 0.592625852514919, "fx": "12", "node_group": "#4EAEF0"}], "edge_weight": 0.951310931497281, "fx": "2", "node_group": "#F8766D"}], "fx": "1", "node_group": "#F8766D"}, {"name": "t0:Men/PNS", "children": [{"name": "t1:Men/PNS", "edge_weight": 0.394183753038851, "fx": "11", "node_group": "#4EAEF0", "children": [{"name": "t2:Men/PNS", "edge_weight": 0.338956748488302, "fx": "12", "node_group": "#4EAEF0"}, {"name": "t2:Mesenchyme", "edge_weight": 0.359940746811268, "fx": "15", "node_group": "#D772EC"}]}], "fx": "10", "node_group": "#4EAEF0"}, {"name": "t0:Liver", "children": [{"name": "t1:Liver", "edge_weight": 0.774741848113587, "fx": "8", "node_group": "#00BA38"}], "fx": "7", "node_group": "#00BA38"}, {"name": "t0:Mesenchyme", "children": [{"name": "t1:Heart", "children": [{"name": "t2:Heart", "edge_weight": 0.716666666666667, "fx": "6", "node_group": "#B79F00"}], "edge_weight": 0.474846023149623, "fx": "5", "node_group": "#B79F00"}, {"name": "t1:Mesenchyme", "children": [{"name": "t2:Mesenchyme", "edge_weight": 0.593794347770586, "fx": "15", "node_group": "#D772EC"}, {"name": "t2:Liver", "edge_weight": 0.555555555555556, "fx": "9", "node_group": "#00BA38"}], "edge_weight": 0.91771680202965, "fx": "14", "node_group": "#D772EC"}], "fx": "13", "node_group": "#D772EC"}], "node_group": "#000000"}
];


// ************** Generate the tree diagram  *****************
var margin = {top: 20, right: 20, bottom: 20, left: 20},
 width = 1200 - margin.right - margin.left,
 height = 1200 - margin.top - margin.bottom;
 
var i = 0;

var tree = d3.layout.tree()
 .size([height, width]);

var diagonal = d3.svg.diagonal()
 .projection(function(d) { return [d.y, d.x]; });

var svg = d3.select("body").append("svg")
 .attr("width", width + margin.right + margin.left)
 .attr("height", height + margin.top + margin.bottom)
  .append("g")
 .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

root = treeData[0];
  
update(root);

function update(source) {

  // Compute the new tree layout.
  var nodes = tree.nodes(root).reverse(),
   links = tree.links(nodes);

  // Normalize for fixed-depth.
  nodes.forEach(function(d) { d.y = d.depth * 58; });

  nodes.forEach(function(d) { d.x = d.fx * 12; });

  // Declare the nodes
  var node = svg.selectAll("g.node")
   .data(nodes, function(d) { return d.id || (d.id = ++i); });

  // Enter the nodes.
  var nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", function(d) { return "translate(" + d.y + "," + d.x + ")"; });

   

  nodeEnter.append("circle")
   .attr("r", 2)
   .style("fill", function(d){return d.node_group})
   .style("stroke", function(d){return d.node_group});

  // Declare the links
  var link = svg.selectAll("path.link")
   .data(links, function(d) { return d.target.id; });

  // Enter the links.
  link.enter().insert("path", "g")
   .attr("class", "link")
   .attr("d", diagonal)
   .attr("opacity", function(d){
        return d.target.edge_weight;});
}

</script>
 
  </body>
</html>
